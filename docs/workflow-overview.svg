<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="720" viewBox="0 0 1320 720" role="img" aria-labelledby="title desc">
  <title id="title">제조 부품 사양 대조 검토 흐름</title>
  <desc id="desc">승인 사양과 도면 초안을 선택해 서버가 현재 개정과 권한을 확인한다. 규칙 추출 또는 선택적 Qwen 제안은 원문 검증을 거쳐 재질, 표면처리, 명목 두께 표기 대조로 이어진다. 검토자가 확인 또는 후속 조치를 기록하고 SQLite에 감사 이력을 남긴다.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26334b"/></pattern>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#202b40"/><stop offset="1" stop-color="#151e2f"/></linearGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f9fbff"/><stop offset="1" stop-color="#9fd7e5"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#81d4df"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#000817" flood-opacity=".34"/></filter>
  </defs>
  <rect width="1320" height="720" fill="#0d1422"/>
  <rect width="1320" height="720" fill="url(#dots)" opacity=".72"/>
  <path d="M 0 0 H 1320" stroke="#33455f"/>
  <g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif">
    <text x="42" y="55" fill="#81d4df" font-size="16" font-weight="700" letter-spacing="2">MANUFACTURING SPEC REVIEW · WORKFLOW</text>
    <text x="42" y="104" fill="url(#headline)" font-size="34" font-weight="700">도면 표기를 원문까지 확인하는 검토 흐름</text>
    <text x="43" y="139" fill="#a9b9ce" font-size="18">승인 사양 ↔ 도면 초안 · 독립 추출 · 규칙 대조 · 사람의 검토 기록</text>
    <rect x="1050" y="37" width="228" height="34" rx="17" fill="#182a38" stroke="#376073"/>
    <circle cx="1070" cy="54" r="5" fill="#78d6bf"/>
    <text x="1084" y="60" fill="#c6e8e6" font-size="15" font-weight="700">합성 데이터 · 로컬 데모</text>

    <!-- The horizontal rail is the implemented runtime path. -->
    <path d="M 264 358 H 289 M 519 358 H 544 M 774 358 H 799 M 1029 358 H 1054" fill="none" stroke="#81d4df" stroke-width="3" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="42" y="196" width="222" height="330" rx="19" fill="url(#panel)" stroke="#42546f"/>
      <rect x="297" y="196" width="222" height="330" rx="19" fill="url(#panel)" stroke="#42546f"/>
      <rect x="552" y="196" width="222" height="330" rx="19" fill="url(#panel)" stroke="#42546f"/>
      <rect x="807" y="196" width="222" height="330" rx="19" fill="url(#panel)" stroke="#42546f"/>
      <rect x="1062" y="196" width="222" height="330" rx="19" fill="url(#panel)" stroke="#42546f"/>
    </g>
    <path d="M 62 197 H 244 M 317 197 H 499 M 572 197 H 754 M 827 197 H 1009 M 1082 197 H 1264" stroke="#ec815f" stroke-width="4" stroke-linecap="round"/>
    <g fill="#0d1422" stroke="#81d4df" stroke-width="3">
      <circle cx="264" cy="358" r="6"/><circle cx="519" cy="358" r="6"/><circle cx="774" cy="358" r="6"/><circle cx="1029" cy="358" r="6"/>
    </g>

    <g fill="#ec9a7e" font-size="15" font-weight="700" letter-spacing="1">
      <text x="62" y="232">01  INPUT</text><text x="317" y="232">02  GATE</text><text x="572" y="232">03  EXTRACT</text><text x="827" y="232">04  COMPARE</text><text x="1082" y="232">05  REVIEW</text>
    </g>
    <g fill="#f5f8fc" font-size="22" font-weight="700">
      <text x="62" y="270">문서 2개</text><text x="317" y="270">서버 검증</text><text x="572" y="270">문서별 추출</text><text x="827" y="270">3개 항목 대조</text><text x="1082" y="270">검토자 기록</text>
    </g>
    <g stroke="#42546f"><path d="M 62 286 H 244 M 317 286 H 499 M 572 286 H 754 M 827 286 H 1009 M 1082 286 H 1264"/></g>

    <rect x="62" y="306" width="182" height="81" rx="11" fill="#27344b" stroke="#536681"/>
    <rect x="62" y="401" width="182" height="81" rx="11" fill="#27344b" stroke="#536681"/>
    <text x="77" y="337" fill="#eff5fa" font-size="18" font-weight="700">승인 사양서</text>
    <text x="77" y="364" fill="#aebdd0" font-size="15">reference spec</text>
    <text x="77" y="432" fill="#eff5fa" font-size="18" font-weight="700">도면 초안</text>
    <text x="77" y="459" fill="#aebdd0" font-size="15">candidate drawing</text>

    <text x="317" y="327" fill="#eaf4f9" font-size="18" font-weight="700">현재 문서 선택</text>
    <text x="317" y="363" fill="#b8c8d8" font-size="17">site · role · 개정</text>
    <text x="317" y="398" fill="#b8c8d8" font-size="17">원문 hash · 권한</text>
    <rect x="317" y="434" width="182" height="51" rx="9" fill="#312a34" stroke="#8b5f66"/>
    <text x="332" y="466" fill="#ffc3ad" font-size="16" font-weight="700">조건 불일치 → 중단</text>

    <rect x="572" y="306" width="182" height="66" rx="10" fill="#203a42" stroke="#467b83"/>
    <rect x="572" y="383" width="182" height="66" rx="10" fill="#293449" stroke="#536681"/>
    <text x="586" y="334" fill="#c5f2e7" font-size="17" font-weight="700">규칙 추출</text>
    <text x="586" y="357" fill="#b8c8d8" font-size="14">기본 경로</text>
    <text x="586" y="411" fill="#f0f5fa" font-size="17" font-weight="700">Qwen3 4B 제안</text>
    <text x="586" y="434" fill="#b8c8d8" font-size="14">선택 모드 · 로컬</text>
    <text x="572" y="482" fill="#9fdce4" font-size="15" font-weight="700">전체 원문 행 · span 검증</text>

    <text x="827" y="330" fill="#dce8f0" font-size="17">재질 표기</text>
    <path d="M 827 347 H 1009" stroke="#394c63"/>
    <text x="827" y="377" fill="#dce8f0" font-size="17">표면처리 표기</text>
    <path d="M 827 394 H 1009" stroke="#394c63"/>
    <text x="827" y="424" fill="#dce8f0" font-size="17">명목 피막 두께</text>
    <text x="827" y="452" fill="#9fdce4" font-size="15">Decimal · mm ↔ µm</text>
    <text x="827" y="487" fill="#b8c8d8" font-size="15">차이 · 누락 · 검토 필요</text>

    <rect x="1082" y="306" width="182" height="66" rx="10" fill="#203a42" stroke="#467b83"/>
    <rect x="1082" y="383" width="182" height="66" rx="10" fill="#3a3037" stroke="#8b5f66"/>
    <text x="1098" y="345" fill="#d4f5e9" font-size="18" font-weight="700">확인</text>
    <text x="1098" y="422" fill="#ffd5bc" font-size="18" font-weight="700">후속 조치 요청</text>
    <text x="1082" y="482" fill="#b8c8d8" font-size="15">설계 승인 판정 아님</text>

    <path d="M 1173 526 V 557" stroke="#81d4df" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="948" y="572" width="336" height="79" rx="14" fill="#1e2c3e" stroke="#4d7183"/>
    <text x="969" y="602" fill="#9fdce4" font-size="17" font-weight="700">SQLite · 검토 / 감사 이력</text>
    <text x="969" y="631" fill="#b8c8d8" font-size="15">중복 기록 방지 · 이전 결정 추적</text>

    <path d="M 42 569 H 896" stroke="#3b4e64"/>
    <text x="42" y="602" fill="#ec9a7e" font-size="17" font-weight="700">예외와 경계</text>
    <text x="42" y="633" fill="#b8c8d8" font-size="16">모델 실패 → 원문 수동 확인 필수   ·   원문 / 개정 / 권한 변경 → 이전 검토 무효</text>
    <text x="42" y="688" fill="#70869d" font-size="14">표기 대조 보조 도구 · 제조 적합성, 재질 대체 가능성, 공차 적합성은 판단하지 않음</text>
  </g>
</svg>
